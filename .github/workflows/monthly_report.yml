name: Monthly Management Report

on:
  schedule:
    # Runs at 08:00 UTC on the 1st of every month
    - cron: "0 8 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Report Month (YYYYMM)"
        required: true
        default: "202603"

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Monthly Report Pack
        run: |
          TARGET_MONTH="${{ github.event.inputs.month || '202603' }}"
          python build_report.py --month "$TARGET_MONTH"

      - name: Upload Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulseiq-monthly-report
          path: reports/*.xlsx